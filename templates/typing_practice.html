<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice - Audio Dictation Practice</title>
        <!-- Preconnect to CDN for faster resource loading -->

        <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

        <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">

        

        <script src="https://cdn.tailwindcss.com"></script>

        <style>

            /* Critical CSS to prevent FOUC */

            svg {

                width: 1.5rem;

                height: 1.5rem;

                display: inline-block;

                vertical-align: middle;

            }

            

            body {

                margin: 0;

                padding: 0;

                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

            }

            

            * {

                box-sizing: border-box;

            }

            

    
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm border-b">
        <div class="w-full px-2 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="{{ url_for('practice_selection') }}" class="text-green-600 hover:text-green-800">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <h1 class="text-xl font-bold text-gray-800">Typing Practice</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">
                        Welcome, <span class="font-medium">{{ session.username }}</span>
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 ml-2">Student</span>
                    </span>
                    <a href="#" onclick="confirmLogout()" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 text-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="w-full px-2 py-8">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-4">Typing Practice</h1>
                <p class="text-xl text-gray-600">Select a typing passage to practice</p>
            </div>

            {% if typing_passages %}
                <div class="grid gap-4">
                    {% for passage in typing_passages %}
                        <div class="bg-white rounded-lg shadow-md p-4 border-l-4 border-blue-500">
                            <div class="flex justify-between items-center">
                                <div class="flex-1">
                                    <h3 class="text-lg font-medium text-gray-800">{{ passage.title }}</h3>
                                    <p class="text-sm text-gray-600 mt-1">
                                        {{ passage.content[:120] }}{% if passage.content|length > 120 %}...{% endif %}
                                    </p>
                                    <div class="flex space-x-4 mt-2 text-xs text-gray-500">
                                        <span>Words: {{ passage.word_count }}</span>
                                        <span>Created: {{ passage.created_at|format_date('%d-%m-%Y') }}</span>
                                    </div>
                                </div>
                                
                                <!-- Favourite Icon -->
                                <div class="text-center px-4">
                                    <button onclick="toggleFavourite({{ passage.id }}, 'typing', this)"
                                            class="favourite-btn p-3 rounded-full hover:bg-gray-100 transition-all duration-300"
                                            data-passage-id="{{ passage.id }}"
                                            data-is-favourite="{{ 'true' if passage.is_favourite else 'false' }}">
                                        {% if passage.is_favourite %}
                                        <svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                                        </svg>
                                        {% else %}
                                        <svg class="w-8 h-8 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                        </svg>
                                        {% endif %}
                                    </button>
                                </div>
                                
                                <!-- Attempts Counter -->
                                <div class="text-center px-6">
                                    <div class="bg-gray-100 rounded-xl p-4">
                                        <div class="text-2xl font-bold text-gray-800">{{ passage.attempt_count or 0 }}</div>
                                        <div class="text-xs text-gray-600 font-medium">Attempts</div>
                                    </div>
                                </div>
                                
                                <!-- Start Typing Button -->
                                <div class="ml-6">
                                    <a href="{{ url_for('typing_simple', passage_id=passage.id) }}"
                                       class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">
                                        ⌨️ Start Typing
                                    </a>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="text-center py-12">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No typing passages available</h3>
                    <p class="mt-1 text-sm text-gray-500">Contact your admin to add typing passages for practice.</p>
                </div>
            {% endif %}
        </div>
    </div>

    <script>
        // Logout Confirmation
        function confirmLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '{{ url_for("logout") }}';
            }
            return false;
        }

        // Toggle Favourite Function
        async function toggleFavourite(id, type, buttonElement) {
            try {
                const url = type === 'dictation'
                    ? `/api/toggle-favourite-dictation/${id}`
                    : `/api/toggle-favourite-typing/${id}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Update the icon
                    const svgElement = buttonElement.querySelector('svg');
                    if (data.is_favourite) {
                        // Show filled heart
                        svgElement.outerHTML = `
                            <svg class="w-8 h-8 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                            </svg>
                        `;
                    } else {
                        // Show empty heart
                        svgElement.outerHTML = `
                            <svg class="w-8 h-8 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        `;
                    }
                    buttonElement.setAttribute('data-is-favourite', data.is_favourite ? 'true' : 'false');
                    
                    // Show feedback message
                    const message = data.is_favourite ? '❤️ Added to favourites!' : '💔 Removed from favourites';
                    showToast(message);
                } else {
                    showToast('❌ Error: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Error toggling favourite:', error);
                showToast('❌ Failed to update favourite', 'error');
            }
        }

        // Toast notification function
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium transition-all duration-300 z-50 ${
                type === 'error' ? 'bg-red-500' : 'bg-green-500'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
